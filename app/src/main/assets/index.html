const info=await Native.identify(type,name);let d=S.devs.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!d){d={id:uid(),name,mfr:info.mfr||'Unknown',model:'Unknown',type,mic:info.mic?1:0,out:1,vol:50};S.devs.push(d)}
if(!conn.includes(d.id))conn.push(d.id);force=false;const p=match(name,type);
L('Device: '+d.name);L('Connection: '+T[type][0]);L('Manufacturer: '+(d.mfr||'not reported'));L('Model: '+(d.model==='Unknown'?'not reported':d.model));L('Profiles: '+info.profiles.join(', '));L('Microphone: '+(d.mic?'Available':'Not available'));L('Audio output: Available');
if(p){d.profile=p.id;if(d.model==='Unknown')d.model=p.model;if(d.mfr==='Unknown')d.mfr=p.mfr;L('Recognition: Successful — matched profile “'+p.name+'”');L('Loaded saved volume '+d.vol+'% and routing');rec={d:d.id,p:p.id,ok:1};logE('Recognised '+d.name+' as '+p.name)}
else{L('Recognition: Not confident — select a saved profile or add this device');rec={d:d.id,ok:0};logE('Connected '+d.name+' (unrecognised)')}
L('Routing → output: '+d.name+', input: '+(d.mic?d.name:'Phone microphone'));save();logE('Routing → '+d.name);
const g=Native.grp(type);runAuto(g==='bt'?'bt-connect':type==='car'?'car-connect':'wired-connect');if(d.id===S.pref)runAuto('preferred-connect');if(p)runAuto('registered-connect');go(cur)}
function simDisc(id){const d=dev(id);conn=conn.filter(x=>x!==id);logE('Disconnected '+d.name);if(rec&&rec.d===id)rec=null;const g=Native.grp(d.type);
if(!conn.length)logE('Routing → phone speaker & mic (fallback)');runAuto(g==='bt'?'bt-disconnect':g==='w'?'wired-disconnect':'any');toast(d.name+' disconnected'+(conn.length?'':' — using phone audio'));go(cur)}
const ACT={voice:'Ember voice mode',handsfree:'Hands-free mode',phone:'Switch to phone audio',focus:'Focus mode',load:'Load saved settings',photo:'Show saved photograph'};
const TRG={'bt-connect':'Bluetooth connects','bt-disconnect':'Bluetooth disconnects','wired-connect':'Wired headset connects','wired-disconnect':'Wired headset disconnects','car-connect':'Car audio connects','preferred-connect':'Preferred device connects','registered-connect':'Registered device connects',time:'At a specific time'};
function doAct(a){if(a==='voice')S.mode='Voice mode';if(a==='handsfree')S.mode='Hands-free';if(a==='focus')S.mode='Focus';if(a==='phone')force=true;save()}
function runAuto(t){if(!S.ctl.au)return;S.autos.filter(a=>a.on&&a.trig===t).forEach(a=>{doAct(a.act);S.runs.unshift({t:new Date().toLocaleTimeString(),m:a.name+' → '+ACT[a.act]});toast('Routine ran: '+ACT[a.act])});S.runs=S.runs.slice(0,40);save()}
setInterval(()=>{const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(n.getSeconds()<10&&setInterval.l!==h){setInterval.l=h;S.autos.filter(a=>a.on&&a.trig==='time'&&a.time===h).forEach(a=>{doAct(a.act);S.runs.unshift({t:n.toLocaleTimeString(),m:a.name});toast('Routine ran: '+a.name)})}},5000);

function setOrb(s){orbS=s;document.querySelectorAll('.orb').forEach(o=>o.className=o.className.replace(/ (listen|proc|speak)/g,'')+(s?' '+s:''));document.querySelectorAll('.wave').forEach(w=>w.classList.toggle('on',s==='listen'||s==='speak'));const o=$('#ost');if(o)o.textContent={listen:'Listening…',proc:'Processing…',speak:'Speaking…','':'Idle — say “'+S.set.wake+'”'}[s];micUI()}
function micUI(){const m=S.ctl.mute?['Mic muted','er']:orbS==='listen'?['● Mic active','er']:['Mic idle','ok'];$('#mic').innerHTML=chip(m[0],m[1])+chip(active().name,'bl')}
function addMsg(w,t){S.sess.push({w,t});S.sess=S.sess.slice(-40);save();const c=$('#chat');if(c){c.insertAdjacentHTML('beforeend',`<div class="m ${w}">${esc(t)}</div>`);c.scrollTop=1e5}}
function reply(q){q=q.toLowerCase();const a=active();
if(/identify|which (headphones|device)/.test(q))return'Connected: '+a.name+(a.model&&a.model!=='Unknown'?' ('+a.mfr+' '+a.model+')':'')+' over '+(T[a.type]?T[a.type][0]:'the phone')+'. '+(prof(a)?'Matched your saved profile.':'No saved profile matched.');
if(/phone speaker|phone audio/.test(q)){force=true;logE('Routing → phone (voice command)');return'Switched to the phone speaker and microphone.'}
if(/translat/.test(q)){setTimeout(()=>go('trans'),1500);return'Opening live translation.'}
if(/focus|playlist|play/.test(q))return'Playing your focus playlist (simulated — no media app is controlled).';
if(/music/.test(q))return'Opening your music app (simulated).';
if(/mute/.test(q)){S.ctl.mute=true;save();return'Microphone muted.'}
return'Offline command mode can’t do that yet. Try: open music, play focus playlist, start translation, switch to phone speaker, identify headphones.'}
async function say(t){t=t.trim();if(!t||busy)return;if(S.ctl.mute)return toast('Microphone is muted — unmute in Control Centre');busy=1;setOrb('listen');addMsg('you',t);await sl(900);setOrb('proc');await sl(800);const r=reply(t);setOrb('speak');addMsg('ember',r);await sl(1500);setOrb('');busy=0;go(cur)}
